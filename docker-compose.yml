version: '3'
services:
  db:
    image: postgres:14.1-alpine
    restart: always
    env_file:
      - .env.local
    healthcheck:
      test: pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./db-data:/var/lib/postgresql/data
  api:
    restart: always
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    env_file:
      - .env.local
      - ./frontend/.env
    volumes:
      - ./backend:/backend
      - ./assets:/app/assets
  web:
    build: frontend
  nginx:
    image: nginx
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
